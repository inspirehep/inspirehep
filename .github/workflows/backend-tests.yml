name: Backend tests

on:
  workflow_call:
    inputs:
      ref:
        description: The reference to test
        type: string
        required: true
      image:
        description: The name of the image to test
        type: string
        required: true
      image-artifact:
        description: Name of the artifact to load the image from
        type: string
        required: false
      suite:
        description: The test suite to run
        type: string
        required: true
      splits:
        description: Number of splits to run in parallel
        type: number
        required: true

env:
  CACHE_PREFIX: ${{ inputs.suite }}-test-durations

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      groups: ${{ steps.generate.outputs.groups }}
      seed: ${{ steps.generate.outputs.seed }}
    steps:
      - id: generate
        name: Generate groups
        run: |
          seq ${{ inputs.splits }} | jq --slurp --compact-output | xargs printf 'groups=%s\n' >>$GITHUB_OUTPUT
          printf 'seed=%d\n' $RANDOM >>$GITHUB_OUTPUT

  test:
    runs-on: ubuntu-24.04
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.setup.outputs.groups) }}
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:14.1
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inspirehep
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        ports:
          - 5672:5672
      elasticsearch:
        image: registry.cern.ch/cern-sis/inspirehep/opensearch:3.4.0
        env:
          bootstrap.memory_lock: true
          ES_JAVA_OPTS: -Xms1024m -Xmx1024m
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: true
        ports:
          - 9200:9200
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download image
        if: ${{ inputs.image-artifact != '' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ inputs.image-artifact }}
          path: ${{ runner.temp }}/images

      - name: Load image
        if: ${{ inputs.image-artifact != '' }}
        run: docker load --input ${{ runner.temp }}/images/image.tar

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Restore only: the durations are combined and saved by update-durations.
      - name: Get durations from cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: test_durations
          key: ${{ env.CACHE_PREFIX }}-combined-${{ inputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-combined-${{ inputs.ref }}-
            ${{ env.CACHE_PREFIX }}-combined-

      - name: Test
        run: >
          docker run
          --pull ${{ inputs.image-artifact != '' && 'never' || 'always' }}
          --entrypoint poetry
          --network="host"
          --env GITHUB_ACTIONS=true
          --env PYTEST_RUN_PATH=backend
          --volume $GITHUB_WORKSPACE/test_durations:/opt/inspire/test_durations
          ${{ inputs.image }}
          run py.test tests/${{ inputs.suite }}
          --splits ${{ inputs.splits }}
          --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --durations-path test_durations/durations.json
          --store-durations
          --random-order-seed ${{ needs.setup.outputs.seed }}

      - name: Upload partial durations
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.suite }}-split-${{ matrix.group }}
          path: test_durations
          overwrite: true
          retention-days: 1

  update-durations:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get durations from cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: test_durations
          key: ${{ env.CACHE_PREFIX }}-combined-${{ inputs.ref }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_PREFIX }}-combined-${{ inputs.ref }}-
            ${{ env.CACHE_PREFIX }}-combined-

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: ${{ inputs.suite }}-split-*
          path: split-durations

      - name: Combine test durations
        uses: ./.github/actions/combine-durations
        with:
          durations-path: test_durations/durations.json
          artifacts-path: split-durations

      - name: Save durations to cache
        uses: actions/cache/save@v6.1.0
        with:
          path: test_durations
          key: ${{ env.CACHE_PREFIX }}-combined-${{ inputs.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
