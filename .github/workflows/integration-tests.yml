name: Integration tests

on:
  workflow_call:
    inputs:
      ref:
        description: The reference to build
        type: string
        required: true
      push:
        description: Push the built images to the registries
        type: boolean
        default: false
    secrets:
      CYPRESS_RECORD_KEY:
        description: Records the e2e runs in Cypress Cloud when set
        required: false
    outputs:
      backend-image-id:
        description: The ID of image that has been buit
        value: ${{ jobs.build-backend.outputs.image-id }}
      ui-image-id:
        description: The ID of image that has been buit
        value: ${{ jobs.build-ui.outputs.image-id }}
      editor-image-id:
        description: The ID of image that has been buit
        value: ${{ jobs.build-editor.outputs.image-id }}
      backoffice-image-id:
        description: The ID of image that has been buit
        value: ${{ jobs.build-backoffice.outputs.image-id }}

jobs:
  build-backend:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      image: inspirehep/hep
      context: backend/
      push: ${{ inputs.push }}
      artifact-name: image-hep
    secrets: inherit

  test-backend:
    needs: build-backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            splits: 1
          - suite: integration
            splits: 8
          - suite: integration-async
            splits: 4
    uses: ./.github/workflows/backend-tests.yml
    with:
      ref: ${{ inputs.ref }}
      image: ${{ needs.build-backend.outputs.image }}
      image-artifact: ${{ !inputs.push && 'image-hep' || '' }}
      suite: ${{ matrix.suite }}
      splits: ${{ matrix.splits }}

  test-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ui/
          target: build-stage
          tags: inspirehep/ui-build:ci
          cache-from: type=registry,ref=inspirehep/ui:buildcache
          load: true

      - name: test
        run: >
          docker run
          --network="host"
          inspirehep/ui-build:ci
          yarn test

  build-ui:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      image: inspirehep/ui
      context: ui/
      push: ${{ inputs.push }}
      artifact-name: image-ui
    secrets: inherit

  test-editor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build
        uses: docker/build-push-action@v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: record-editor/
          target: build-stage
          tags: inspirehep/editor-build:ci
          cache-from: type=registry,ref=inspirehep/editor:buildcache
          load: true

      - name: test
        run: >
          docker run
          --network="host"
          inspirehep/editor-build:ci
          yarn lint

  build-editor:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      image: inspirehep/editor
      context: record-editor/
      push: ${{ inputs.push }}
      artifact-name: image-editor
    secrets: inherit

  build-backoffice:
    uses: ./.github/workflows/build-backoffice-workflow.yml
    with:
      ref: ${{ inputs.ref }}
      image: cern-sis/inspire/backoffice
      context: ./backoffice
      dockerfile: ./backoffice/Dockerfile
      push: ${{ inputs.push }}
      artifact-name: image-backoffice
    secrets: inherit

  test-e2e:
    needs: [ build-backend, build-ui, build-editor, build-backoffice ]
    uses: ./.github/workflows/e2e-tests.yml
    with:
      ref: ${{ inputs.ref }}
      backend-image: ${{ needs.build-backend.outputs.image }}
      ui-image: ${{ needs.build-ui.outputs.image }}
      editor-image: ${{ needs.build-editor.outputs.image }}
      backoffice-image: ${{ needs.build-backoffice.outputs.image }}
      load-image-artifacts: ${{ !inputs.push }}
    secrets: inherit
