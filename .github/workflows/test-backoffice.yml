name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: The reference to build
        type: string
        required: true
      push:
        description: Push the built images to the registries
        type: boolean
        default: false
    secrets:
      CYPRESS_RECORD_KEY:
        description: Records the e2e runs in Cypress Cloud when set
        required: false
    outputs:
      image-id:
        description: The ID of image that has been built
        value: ${{ jobs.build.outputs.image-id }}

jobs:
  build:
    uses: ./.github/workflows/build-backoffice-workflow.yml
    with:
      ref: ${{ inputs.ref }}
      image: cern-sis/inspire/backoffice
      context: ./backoffice
      dockerfile: ./backoffice/Dockerfile
      push: ${{ inputs.push }}
      artifact-name: image-backoffice
    secrets: inherit

  test:
    needs: build
    runs-on: ubuntu-24.04
    services:
      opensearch:
        image: registry.cern.ch/cern-sis/inspirehep/opensearch:3.4.0
        env:
          bootstrap.memory_lock: true
          ES_JAVA_OPTS: -Xms1024m -Xmx1024m
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: true
        ports:
          - 9200:9200
      rabbitmq:
        image: rabbitmq:4.2-management-alpine
        ports:
          - 5672:5672
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
      db-backoffice:
        image: postgres:15.15
        env:
          POSTGRES_DB: backoffice
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Download image
        if: ${{ !inputs.push }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: image-backoffice
          path: ${{ runner.temp }}/images

      - name: Load image
        if: ${{ !inputs.push }}
        run: docker load --input ${{ runner.temp }}/images/image.tar

      - name: Test
        working-directory: ./backoffice
        run: >
          docker run
          --pull ${{ inputs.push && 'always' || 'never' }}
          --network=host
          --entrypoint poetry
          --env DJANGO_SETTINGS_MODULE=config.settings.test
          --env DISABLE_SECURITY_PLUGIN=true
          --env POSTGRES_DB=backoffice
          --env POSTGRES_USER=postgres
          --env POSTGRES_PASSWORD=postgres
          --env POSTGRES_HOST=127.0.0.1
          --env OPENSEARCH_HOST=127.0.0.1:9200
          ${{ needs.build.outputs.image }}
          run pytest

  build-backend:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      image: inspirehep/hep
      context: backend/
      push: ${{ inputs.push }}
      artifact-name: image-hep
    secrets: inherit

  build-ui:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      image: inspirehep/ui
      context: ui/
      push: ${{ inputs.push }}
      artifact-name: image-ui
    secrets: inherit

  build-editor:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref }}
      image: inspirehep/editor
      context: record-editor/
      push: ${{ inputs.push }}
      artifact-name: image-editor
    secrets: inherit

  test-e2e:
    needs: [build, build-backend, build-ui, build-editor]
    uses: ./.github/workflows/e2e-tests.yml
    with:
      ref: ${{ inputs.ref }}
      backend-image: ${{ needs.build-backend.outputs.image }}
      ui-image: ${{ needs.build-ui.outputs.image }}
      editor-image: ${{ needs.build-editor.outputs.image }}
      backoffice-image: ${{ needs.build.outputs.image }}
      load-image-artifacts: ${{ !inputs.push }}
    secrets: inherit
