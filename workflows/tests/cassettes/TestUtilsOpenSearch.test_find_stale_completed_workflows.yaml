        nonexclusive-distrib 1.0\",\"material\":\"preprint\"}],\"citeable\":true,\"abstracts\":[{\"value\":\"Matrix
        elements of simple operators are central to thermalization in chaotic quantum
        many-body systems. Their moments are often described statistically through
        the Eigenstate Thermalization Hypothesis. In this paper, we study a more refined
        characterization of these matrix elements: the eigenspectrum of simple operators
        once projected to microcanonical energy windows. The spectrum encodes all
        moments of the matrix elements at once, and is particularly relevant when
        the spectrum of the Hamiltonian is degenerate. Assuming that the eigenbasis
        of the simple operator is Haar-randomly oriented with respect to that of the
        Hamiltonian, we prove that the spectrum of an operator projected to a small
        microcanonical window obeys Gaussian random matrix statistics. We do this
        directly by studying the probability distribution inherited from the random
        orientation, as well as using tools from Free Probability Theory. We discuss
        the implications for BPS chaos and more generally for eigenstate thermalization.\",\"source\":\"arXiv\"}],\"documents\":[{\"key\":\"2609.22422.pdf\",\"url\":\"http://s3:9000/data-store/31a4423c-be2d-4817-9669-9adb0195b7d1/documents/2609.22422.pdf\",\"hidden\":true,\"source\":\"arxiv\",\"fulltext\":true,\"material\":\"preprint\",\"original_url\":\"https://arxiv.org/pdf/2609.22422\"}],\"references\":[{\"raw_refs\":[{\"value\":\"[1]
